{% extends "base.html" %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
<section class="error-page">
    <h2>Error 404 - Página no encontrada</h2>
    <p>{{ mensaje|default("Lo sentimos, el recurso que estás buscando no existe o ha sido movido.") }}</p>
    <a href="{{ url_for('inicio') }}" class="btn">Volver a la página de inicio</a>
</section>
{% endblock %}
